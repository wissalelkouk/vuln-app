name: security

on:
  pull_request:
  push:
    branches: [main]

# Permissions minimales par défaut
permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # historique complet pour Gitleaks
      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            git /repo --verbose --redact

  sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # uniquement pour publier le SARIF
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Semgrep
        run: |
          docker run --rm -v "$PWD:/src" semgrep/semgrep \
            semgrep scan --config p/javascript --config p/owasp-top-ten --config .semgrep/no-log-body.yml \
            --metrics=off --error --sarif --output /src/semgrep.sarif /src
      - name: Upload SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: npm ci + npm audit
        run: |
          docker run --rm -v "$PWD:/app" -w /app node:24-alpine \
            sh -c "npm ci && npm audit --audit-level=high"

  image:
    runs-on: ubuntu-latest
    needs: [secrets, sast, dependencies]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build
        run: docker build -t vuln-app:ci .
      - name: Trivy image
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --severity CRITICAL --exit-code 1 --scanners vuln --no-progress \
            --ignore-unfixed vuln-app:ci
      - name: Trivy config
        run: |
          docker run --rm -v "$PWD:/src" aquasec/trivy:latest \
            config --severity HIGH,CRITICAL --exit-code 1 /src
