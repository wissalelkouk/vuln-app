# TP10 partie 2 : hook pre-commit qui bloque un commit contenant un secret.
# Installation : pipx install pre-commit && pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0 # TODO : remplacer par la dernière version publiée (pre-commit autoupdate)
    hooks:
      - id: gitleaks
